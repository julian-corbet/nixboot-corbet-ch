# Trusted pushes run on the warm Crow agent. Keep pull requests on the isolated
# GitHub-hosted runner: Crow's local backend executes directly in our trusted
# build environment and must not run code from an untrusted contribution.
when:
  - event: [push, manual]

steps:
  - name: flake-check
    image: bash
    commands:
      # --all-systems is intentional: a plain flake check can report success
      # after omitting checks that are incompatible with the runner system.
      # --keep-going reports every failing check in one run; without it the
      # first failure aborts and hides every check behind it.
      - nix flake check --all-systems --keep-going --print-build-logs
